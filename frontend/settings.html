<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pension Helper · Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<meta name="color-scheme" content="light dark">
<script>(function(){var d=document.documentElement,t,m=null,q=/[?&]motion=(on|auto)/.exec(location.search);try{if(q){q[1]==='on'?localStorage.setItem('ph-motion','on'):localStorage.removeItem('ph-motion')}t=localStorage.getItem('ph-theme');m=localStorage.getItem('ph-motion')}catch(e){}d.dataset.theme=t==='dark'||t==='light'?t:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');if(m==='on')d.classList.add('force-motion');if(m==='on'||!matchMedia('(prefers-reduced-motion: reduce)').matches)d.classList.add('js-anim')})();</script>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="shell-side"></aside>
  <div>
    <div class="mobile-bar" id="shell-top"></div>
    <main class="main" style="max-width:980px">
      <div class="page-head"><div><h1>Settings</h1><p>Your account, DA rates and activity.</p></div></div>
      <div class="banner" id="error"><div><strong>Couldn't load settings.</strong> <span id="error-text"></span></div></div>
      <div style="display:grid;grid-template-columns:minmax(0,1fr);gap:18px">
        <section class="card"><div class="card-head"><h2>Your account</h2></div><div class="card-body" id="account"><div style="display:grid;gap:10px"><div class="skeleton" style="width:50%"></div><div class="skeleton" style="width:35%"></div><div class="skeleton" style="width:60%"></div></div></div></section>

        <section class="card">
          <div class="card-head"><h2>Dearness Relief (DA) rates</h2><span class="hint">Used to work out each expected pension</span></div>
          <div class="card-body">
            <form id="da" novalidate>
              <div class="form-grid">
                <div class="field"><label for="da-old">DA rate before the change (%)</label><input class="input" id="da-old" name="da_old" type="number" step="0.5" min="0" max="300"></div>
                <div class="field"><label for="da-new">New DA rate (%)</label><input class="input" id="da-new" name="da_new" type="number" step="0.5" min="0" max="300"></div>
                <div class="field"><label for="da-from">New rate applies from (month)</label><input class="input" id="da-from" name="da_new_from" type="month"></div>
                <div class="field"><label>&nbsp;</label><button class="btn primary" type="submit" id="da-save">Save DA rates</button></div>
              </div>
              <p class="cell-sub" id="da-example" style="margin:0"></p>
            </form>
          </div>
        </section>

        <section class="card">
          <div class="card-head"><h2>Change password</h2></div>
          <div class="card-body">
            <form id="pw" novalidate>
              <div class="form-error" id="pw-err" role="alert" hidden></div>
              <div class="form-grid">
                <div class="field full"><label for="current_password">Current password</label><input class="input" id="current_password" name="current_password" type="password" autocomplete="current-password"></div>
                <div class="field"><label for="new_password">New password</label><input class="input" id="new_password" name="new_password" type="password" autocomplete="new-password"><span class="hint">At least 10 characters.</span></div>
                <div class="field"><label for="again">New password again</label><input class="input" id="again" name="again" type="password" autocomplete="new-password"></div>
              </div>
              <button class="btn primary" type="submit">Change password</button>
            </form>
          </div>
        </section>

        <section class="card">
          <div class="card-head"><h2>Recent activity</h2><span class="hint">What happened in your account</span></div>
          <div style="overflow:auto;max-height:380px"><table class="simple" id="activity"></table></div>
        </section>
      </div>
    </main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/assets/common.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="/assets/ui.js"></script>
<script src="/assets/settings.js"></script>
</body>
</html>
