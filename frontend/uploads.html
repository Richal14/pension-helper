<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pension Helper · Uploads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<meta name="color-scheme" content="light dark">
<script>(function(){var d=document.documentElement,t,m=null,q=/[?&]motion=(on|auto)/.exec(location.search);try{if(q){q[1]==='on'?localStorage.setItem('ph-motion','on'):localStorage.removeItem('ph-motion')}t=localStorage.getItem('ph-theme');m=localStorage.getItem('ph-motion')}catch(e){}d.dataset.theme=t==='dark'||t==='light'?t:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');if(m==='on')d.classList.add('force-motion');if(m==='on'||!matchMedia('(prefers-reduced-motion: reduce)').matches)d.classList.add('js-anim')})();</script>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="shell-side"></aside>
  <div>
    <div class="mobile-bar" id="shell-top"></div>
    <main class="main" style="max-width:980px">
      <div class="page-head">
        <div><h1>Uploads</h1><p id="sub">Add documents. Every file is checked, and you see what was found before anything is saved.</p></div>
        <div class="page-actions"><a class="btn" href="/dashboard">← Back to dashboard</a></div>
      </div>
      <div class="banner" id="error"><div><strong>Couldn't open uploads.</strong> <span id="error-text"></span></div></div>
      <div id="area" data-auto-reveal><div class="up-grid">
        <div class="card skeleton-card"><div class="skeleton" style="width:35%;height:20px"></div><div class="skeleton" style="height:120px;border-radius:18px"></div></div>
        <div class="card skeleton-card"><div class="skeleton" style="width:40%;height:20px"></div><div class="skeleton" style="height:120px;border-radius:18px"></div></div>
      </div></div>
    </main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/assets/common.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="/assets/ui.js"></script>
<script src="/assets/uploads.js"></script>
<script>
mountShell('uploads').then(me => {
  if (me.role === 'family') $('#sub').textContent = "Upload the pensioner's bank statements (CSV or PDF). The files are not saved; only monthly pension totals are kept.";
  mountUploads($('#area'), { role: me.role });
}).catch(e => { $('#error-text').textContent = e.message; $('#error').classList.add('show'); });
</script>
</body>
</html>
